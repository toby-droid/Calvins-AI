<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.A.L.V.I.N. OS v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #ff8c00; font-family: 'Courier New', Courier, monospace; }
        .terminal-border { border: 1px solid #ff8c00; }
        .crt-overlay { pointer-events: none; position: fixed; top:0; left:0; width:100%; height:100%; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06)); background-size: 100% 4px, 3px 100%; opacity: 0.2; }
    </style>
</head>
<body class="h-screen p-4 flex flex-col overflow-hidden">
    <div id="crt-shader" class="crt-overlay"></div>

    <header class="flex justify-between items-center mb-2 terminal-border p-2">
        <h1 id="sys-title" class="text-xs tracking-widest uppercase">C.A.L.V.I.N. OS :: ACTIVE</h1>
        <div class="flex gap-2">
            <button onclick="toggleSettings()" class="border border-orange-600 px-3 hover:bg-orange-900">SETTINGS</button>
            <button onclick="window.location.reload()" class="border border-orange-600 px-3 hover:bg-orange-900">X</button>
        </div>
    </header>

    <div id="chat-window" class="flex-1 terminal-border p-4 mb-2 overflow-y-auto space-y-4">
        <div class="text-orange-400">CALVIN_CORE: Diagnostics active. Waiting for input.</div>
    </div>

    <div class="terminal-border p-1 flex">
        <input id="user-input" type="text" class="flex-1 bg-transparent p-2 outline-none uppercase" placeholder="Type prompt command...">
        <button id="send-btn" class="border border-orange-600 px-6 py-2 hover:bg-orange-900 transition uppercase">[ Send ]</button>
    </div>

    <div id="settings-overlay" class="hidden absolute top-20 left-20 w-1/2 bg-black border border-orange-600 p-6 z-50">
        <h2 class="mb-4 font-bold border-b border-orange-600">SYSTEM CALIBRATION</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-xs">CRT MONITOR NOISE</label>
                <select id="setting-crt" class="bg-black border border-orange-600 w-full p-2 mt-1">
                    <option value="on">ACTIVE SHADER</option>
                    <option value="off">OFF</option>
                </select>
            </div>
            <div>
                <label class="block text-xs">DOCK SEARCH BAR BEHAVIOR</label>
                <select id="setting-search" class="bg-black border border-orange-600 w-full p-2 mt-1">
                    <option value="chat">INTERCEPT COMMAND TO LOCAL CHAT AI</option>
                    <option value="web">PASS TO EXTERNAL SEARCH</option>
                </select>
            </div>
            <button onclick="applySettings()" class="w-full border border-orange-600 py-2 mt-4 hover:bg-orange-900">[ SAVE SYSTEM CHANGES ]</button>
        </div>
    </div>

    <script>
        const API_KEY = ""; 
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        
        function toggleSettings() { document.getElementById('settings-overlay').classList.toggle('hidden'); }

        function applySettings() {
            const crt = document.getElementById('setting-crt').value;
            const search = document.getElementById('setting-search').value;
            document.getElementById('crt-shader').style.display = (crt === 'on' ? 'block' : 'none');
            alert("Settings applied to system core.");
            toggleSettings();
        }

        async function executeCommand() {
            const cmd = userInput.value.trim();
            if (!cmd) return;
            
            userInput.value = '';
            chatWindow.innerHTML += `<div><span class="text-orange-600">USER_SECURE:</span> ${cmd}</div>`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `You are C.A.L.V.I.N., a trapped AI. User command: ${cmd}` }] }] })
                });
                const data = await response.json();
                chatWindow.innerHTML += `<div><span class="text-orange-600">CALVIN_CORE:</span> ${data.candidates[0].content.parts[0].text}</div>`;
            } catch (e) {
                chatWindow.innerHTML += `<div><span class="text-red-600">SYSTEM_ERROR:</span> Connection failed.</div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        document.getElementById('send-btn').onclick = executeCommand;
    </script>
</body>
</html>
