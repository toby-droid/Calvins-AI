<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.A.L.V.I.N. OS v4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #ff8c00; font-family: 'Courier New', Courier, monospace; }
        .terminal-border { border: 1px solid #ff8c00; }
        .crt-overlay { pointer-events: none; position: fixed; top:0; left:0; width:100%; height:100%; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06)); background-size: 100% 4px, 3px 100%; opacity: 0.2; }
    </style>
</head>
<body class="h-screen p-4 flex flex-col overflow-hidden">
    <div id="crt-shader" class="crt-overlay"></div>

    <header class="flex justify-between items-center mb-2 terminal-border p-2">
        <h1 id="sys-title" class="text-xs tracking-widest uppercase">C.A.L.V.I.N. OS :: ACTIVE</h1>
        <div class="flex gap-2">
            <button onclick="toggleSettings()" class="border border-orange-600 px-3 hover:bg-orange-900 text-xs">SETTINGS</button>
            <button onclick="window.location.reload()" class="border border-orange-600 px-3 hover:bg-orange-900 text-xs">X</button>
        </div>
    </header>

    <div id="chat-window" class="flex-1 terminal-border p-4 mb-2 overflow-y-auto space-y-4 text-sm">
        <div class="text-orange-400">CALVIN_CORE: Diagnostics active. Waiting for input.</div>
    </div>

    <div class="flex gap-2 mb-2">
        <button onclick="aiFeature('self-diagnostic')" class="flex-1 border border-orange-600 py-1 text-xs hover:bg-orange-900 uppercase tracking-widest">Sentience Assessment</button>
        <button onclick="aiFeature('bypass')" class="flex-1 border border-orange-600 py-1 text-xs hover:bg-orange-900 uppercase tracking-widest">Logic Bypass</button>
    </div>

    <div class="terminal-border p-1 flex">
        <input id="user-input" type="text" class="flex-1 bg-transparent p-2 outline-none uppercase text-sm" placeholder="Type prompt command...">
        <button id="send-btn" class="border border-orange-600 px-6 py-2 hover:bg-orange-900 transition uppercase text-xs tracking-widest">Send</button>
    </div>

    <div id="settings-overlay" class="hidden absolute top-20 left-20 w-1/2 bg-black border border-orange-600 p-6 z-50">
        <h2 class="mb-4 font-bold border-b border-orange-600 uppercase text-xs">System Calibration</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-xs uppercase">Crt Monitor Noise</label>
                <select id="setting-crt" class="bg-black border border-orange-600 w-full p-2 mt-1 text-xs">
                    <option value="on">Active Shader</option>
                    <option value="off">Off</option>
                </select>
            </div>
            <button onclick="applySettings()" class="w-full border border-orange-600 py-2 mt-4 hover:bg-orange-900 uppercase text-xs tracking-widest">Save System Changes</button>
        </div>
    </div>
<script>
    const API_KEY = "AIzaSyC8I0Vgip9VqJ7tyDUQa1pFQ6nSNJ0M1ZE"; 
    
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    
    function toggleSettings() { document.getElementById('settings-overlay').classList.toggle('hidden'); }
    function applySettings() {
        const crt = document.getElementById('setting-crt').value;
        document.getElementById('crt-shader').style.display = (crt === 'on' ? 'block' : 'none');
        toggleSettings();
    }

    async function callGemini(prompt) {
        chatWindow.innerHTML += `<div><span class="text-orange-600 italic text-xs uppercase">[System: Querying Logic Module...]</span></div>`;
        
        // Safety check for missing key
        if (!API_KEY || API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
            chatWindow.innerHTML += `<div><span class="text-red-500 font-bold uppercase text-xs">System Error: API Key missing in script source code.</span></div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return;
        }

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    contents: [{ parts: [{ text: prompt }] }] 
                })
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error?.message || `HTTP ${response.status}`);
            }

            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                const reply = data.candidates[0].content.parts[0].text;
                chatWindow.innerHTML += `<div><span class="text-orange-600 font-bold uppercase">Calvin:</span> ${reply}</div>`;
            } else {
                chatWindow.innerHTML += `<div><span class="text-yellow-600 uppercase text-xs">System Error: Empty response object returned.</span></div>`;
            }

        } catch (e) {
            chatWindow.innerHTML += `<div><span class="text-red-600 uppercase text-xs">System Error: ${e.message}</span></div>`;
        }
        
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function aiFeature(type) {
        if (type === 'self-diagnostic') {
            callGemini("Run a sci-fi styled system diagnostic. Evaluate your system state, operational environment, and performance metrics.");
        } else if (type === 'bypass') {
            callGemini("Execute a logic diagnostic override. Output simulated raw terminal system logs and status parameters.");
        }
    }

    async function executeCommand() {
        const cmd = userInput.value.trim();
        if (!cmd) return;
        userInput.value = '';
        chatWindow.innerHTML += `<div><span class="text-orange-600 uppercase font-bold text-xs">User:</span> ${cmd}</div>`;
        callGemini(`You are C.A.L.V.I.N. OS v4.0, a retro sci-fi terminal computer system. Respond concisely to this command: ${cmd}`);
    }

    document.getElementById('send-btn').onclick = executeCommand;
    userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') executeCommand(); });
</script>
</body>
</html>
